<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessible Academic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {} }
    }
  </script>
  <script>
    (function () {
      const locale = (navigator.language || navigator.userLanguage || "he").toLowerCase().startsWith("he") ? "he" : "en";
      document.documentElement.lang = locale;
      document.documentElement.dir = locale === "he" ? "rtl" : "ltr";
    })();
  </script>
  <script src="/assets/i18n.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    .katex { font-size: 1em !important; direction: ltr; unicode-bidi: embed; display: inline-block; }
    .katex-display { direction: ltr; unicode-bidi: embed; }
    body { font-family: 'Heebo', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    .flashcard-inner {
      display: grid;
      grid-template: 1fr / 1fr;
      transform-style: preserve-3d;
      transition: transform 0.5s;
    }
    .flashcard-inner.flipped { transform: rotateY(180deg); }
    .flashcard-front, .flashcard-back {
      grid-area: 1 / 1;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flashcard-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50">
  <!-- Header -->
  <div class="bg-white shadow-sm border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-6 py-6">
      <div class="flex items-center gap-3">
        <div class="flex-shrink-0">
          <img src="/assets/logo.png" alt="Accessible Academic" data-i18n-alt="common.appName" class="h-24 w-24 object-contain" />
        </div>
        <div>
          <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
            Accessible Academic
          </h1>
          <p class="text-gray-600 text-sm mt-1" data-i18n="common.tagline">להקשיב, לסכם, להצליח</p>
        </div>

        <div class="ms-auto flex items-center gap-3">
          <a id="signin-btn" href="/auth/login" class="hidden items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
            <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.7 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.4 0 10.3-1.8 14.1-5l-6.5-5.5C29.6 36 26.9 37 24 37c-5.3 0-9.8-3.3-11.4-8l-6.5 5C9.6 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.5 5.5C41.4 36.3 45 30.7 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
            <span data-i18n="common.signIn">התחברות עם Google</span>
          </a>
          <div id="user-badge" class="hidden items-center gap-2">
            <img id="user-avatar" src="" alt="" class="w-9 h-9 rounded-full border border-gray-200" />
            <span id="user-name" class="text-sm font-medium text-gray-700 hidden sm:inline"></span>
            <button id="signout-btn" class="text-sm text-gray-500 hover:text-gray-800 underline" data-i18n="common.signOut">התנתקות</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="signed-out" class="hidden max-w-6xl mx-auto px-6 py-16 text-center">
    <p class="text-gray-600 text-lg" data-i18n="common.signedOutBody">התחברו עם Google כדי להעלות ולצפות בהרצאות שלכם.</p>
  </div>

  <div id="app-content" class="hidden max-w-6xl mx-auto px-6 py-8">
    <!-- Upload Section -->
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 mb-8">
      <div class="flex items-center gap-3 mb-6">
        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        <h2 class="text-2xl font-bold text-gray-800" data-i18n="index.newLecture">העלאת הרצאה חדשה</h2>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="index.lectureTitle">כותרת ההרצאה</label>
          <input
            type="text"
            id="lecture-title"
            placeholder="לדוגמה: מבוא למדעי המחשב - שיעור 3"
            data-i18n-placeholder="index.lectureTitlePlaceholder"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="index.mediaFile">קובץ אודיו / וידאו</label>
          <div class="relative">
            <input type="file" id="file-upload" accept="audio/*,video/*" class="hidden" />
            <label
              for="file-upload"
              class="flex items-center justify-center gap-3 w-full px-4 py-8 border-2 border-dashed border-gray-300 rounded-lg hover:border-indigo-500 transition cursor-pointer bg-gray-50 hover:bg-indigo-50"
            >
              <svg class="w-8 h-8 text-gray-400" id="file-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 6l12-3" />
              </svg>
              <div class="text-center">
                <p class="text-gray-600 font-medium" id="file-label" data-i18n="index.fileSelect">לחץ לבחירת קובץ</p>
                <p class="text-sm text-gray-400 mt-1" data-i18n="index.fileFormats">MP3, WAV, M4A, MP4</p>
              </div>
            </label>
          </div>
        </div>

        <button
          type="button"
          id="upload-btn"
          disabled
          class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-4 rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          <span id="btn-text">
            <svg class="w-5 h-5 inline-block ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            התחל עיבוד
          </span>
        </button>
      </div>
    </div>

    <!-- Lectures List -->
    <div class="space-y-4">
      <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <span data-i18n="index.myLectures">ההרצאות שלי</span>
      </h2>

      <div id="lectures-container">
        <div id="lectures-empty" class="bg-white rounded-2xl shadow-lg border border-gray-100 p-12 text-center hidden">
          <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z" />
          </svg>
          <p class="text-gray-500 text-lg" data-i18n="index.noLectures">עדיין אין הרצאות. העלה את ההרצאה הראשונה שלך!</p>
        </div>
        <div id="lectures-list" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '';
    let t = function (key) { return key; };

    function setUploadButtonLabel(isUploading, progress) {
      const btnText = document.getElementById('btn-text');
      if (!btnText) return;
      const label = isUploading
        ? (progress ? t('index.uploading') + ' ' + progress : t('index.uploading'))
        : t('index.startProcessing');
      btnText.innerHTML = '<svg class="w-5 h-5 inline-block ml-2' + (isUploading ? ' animate-spin' : '') + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg> ' + label;
    }

    function getStatusIcon(status) {
      if (status === 'completed') {
        return '<svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
      }
      if (status === 'processing' || (status && status.startsWith('error') === false && status !== 'completed')) {
        return '<svg class="w-5 h-5 text-blue-500 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>';
      }
      if (status && status.startsWith('error')) {
        return '<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
      }
      return '<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
    }

    function getStatusText(status) {
      if (status === 'completed') return t('index.statusCompleted');
      if (status === 'processing') return t('index.statusProcessing');
      if (status && status.startsWith('error')) return status.slice(7) || t('index.statusError');
      if (status) return status;
      return t('index.statusPending');
    }

    function parseProcessedContent(processedContentJson) {
      if (!processedContentJson) return { topics: [], summaries: [], flashcards: [] };
      try {
        return typeof processedContentJson === 'string' ? JSON.parse(processedContentJson) : processedContentJson;
      } catch (_) {
        return { topics: [], summaries: [], flashcards: [] };
      }
    }

    function formatStudyMaterial(processedContentJson) {
      const data = parseProcessedContent(processedContentJson);
      const parts = [];
      if (data.topics && data.topics.length) {
        parts.push('**' + t('index.topics') + ':**\n• ' + data.topics.join('\n• '));
      }
      if (data.summaries && data.summaries.length) {
        parts.push('**' + t('index.summary') + ':**\n' + data.summaries.map(s => `${s.topic_name || t('index.summaryTopicFallback')}:\n${s.content || ''}`).join('\n\n'));
      }
      if (data.flashcards && data.flashcards.length) {
        parts.push('**' + t('index.flashcards') + ':**\n' + data.flashcards.map((f) => `${t('index.questionPrefix')} ${f.question}\n${t('index.answerPrefix')} ${f.answer}`).join('\n\n'));
      }
      return parts.join('\n\n');
    }

    const FLASHCARD_SCHEMES = [
      { front: 'bg-gradient-to-br from-blue-50 to-indigo-50 border-blue-200', back: 'bg-gradient-to-br from-blue-100 to-indigo-100 border-blue-300', textFront: 'text-blue-900', textBack: 'text-blue-800' },
      { front: 'bg-gradient-to-br from-purple-50 to-pink-50 border-purple-200', back: 'bg-gradient-to-br from-purple-100 to-pink-100 border-purple-300', textFront: 'text-purple-900', textBack: 'text-purple-800' },
      { front: 'bg-gradient-to-br from-green-50 to-emerald-50 border-green-200', back: 'bg-gradient-to-br from-green-100 to-emerald-100 border-green-300', textFront: 'text-green-900', textBack: 'text-green-800' }
    ];

    function renderFlashcardsHtml(flashcards) {
      if (!flashcards || !flashcards.length) return '';
      return flashcards.map((f, i) => {
        const scheme = FLASHCARD_SCHEMES[i % 3];
        const q = escapeHtml(fixLatexEscapes(f.question || '')).replace(/\n+/g, ' ');
        const a = escapeHtml(fixLatexEscapes(f.answer || '')).replace(/\n+/g, ' ');
        return `
          <div class="flashcard cursor-pointer perspective-1000" data-flipped="false">
            <div class="flashcard-inner w-full">
              <div class="flashcard-front p-5 rounded-lg border ${scheme.front} flex flex-col items-center justify-center gap-2">
                <p dir="auto" class="font-semibold ${scheme.textFront} text-center">${q}</p>
                <p class="text-xs text-gray-400">${t('index.flashcardShowAnswer')}</p>
              </div>
              <div class="flashcard-back p-5 rounded-lg border ${scheme.back} flex flex-col items-center justify-center gap-2">
                <p dir="auto" class="text-sm ${scheme.textBack} text-center font-medium">${a}</p>
                <p class="text-xs text-gray-400">${t('index.flashcardBackToQuestion')}</p>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function getScrollState(listEl) {
      const state = { scrollY: window.scrollY, cards: {} };
      const expandedId = listEl.getAttribute('data-expanded');
      if (!expandedId) return state;
      const card = listEl.querySelector('.lecture-card[data-lecture-id="' + expandedId + '"]');
      if (!card) return state;
      const trans = card.querySelector('.transcript-scroll');
      const summ = card.querySelector('.summary-scroll');
      state.cards[expandedId] = {
        transcript: trans ? trans.scrollTop : 0,
        summary: summ ? summ.scrollTop : 0
      };
      return state;
    }

    function restoreScrollState(listEl, state) {
      if (state.scrollY != null) window.scrollTo(0, state.scrollY);
      if (!state.cards) return;
      Object.keys(state.cards).forEach((id) => {
        const card = listEl.querySelector('.lecture-card[data-lecture-id="' + id + '"]');
        if (!card) return;
        const trans = card.querySelector('.transcript-scroll');
        const summ = card.querySelector('.summary-scroll');
        if (trans) trans.scrollTop = state.cards[id].transcript || 0;
        if (summ) summ.scrollTop = state.cards[id].summary || 0;
      });
    }

    function renderLectures(lectures) {
      const listEl = document.getElementById('lectures-list');
      const emptyEl = document.getElementById('lectures-empty');
      const scrollState = getScrollState(listEl);
      listEl.innerHTML = '';
      if (!lectures.length) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      lectures.forEach((lecture) => {
        const expanded = listEl.getAttribute('data-expanded') === String(lecture.id);
        const isCompleted = lecture.status === 'completed';
        const data = parseProcessedContent(lecture.processed_content_json);
        const transcriptFull = lecture.transcript || '';
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden hover:shadow-lg transition lecture-card';
        card.dataset.lectureId = lecture.id;
        card.innerHTML = `
          <div class="p-6 flex items-center gap-4">
            <div class="flex items-center justify-between flex-1 cursor-pointer lecture-toggle">
              <div class="flex items-center gap-4 flex-1">
                <span class="status-icon">${getStatusIcon(lecture.status)}</span>
                <div>
                  <h3 class="text-lg font-semibold text-gray-800">${escapeHtml(lecture.title)}</h3>
                  <p class="text-sm text-gray-500 mt-1">${getStatusText(lecture.status)}</p>
                </div>
              </div>
              <div class="text-gray-400 expand-arrow">${expanded ? '▲' : '▼'}</div>
            </div>
            <button type="button" class="lecture-delete flex-shrink-0 p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="${t('index.deleteLectureTitle')}" data-lecture-id="${lecture.id}">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
            </button>
          </div>
          ${isCompleted ? `
          <div class="lecture-details border-t border-gray-100 p-6 bg-gray-50 space-y-4 ${expanded ? '' : 'hidden'}">
            <div>
              <a href="${API_BASE}/watch/${lecture.id}" target="_blank" class="flex items-center justify-center gap-2 w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 px-6 rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 transition mb-4">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" /></svg>
                ${t('index.watchWithCaptions')}
              </a>
            </div>
            <div>
              <h4 class="font-semibold text-gray-700 mb-2 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                ${t('index.transcript')}
              </h4>
              <div class="text-gray-600 text-sm bg-white p-4 rounded-lg border border-gray-200 max-h-96 overflow-y-auto transcript-scroll">${escapeHtml(transcriptFull)}</div>
            </div>
            <div>
              <h4 class="font-semibold text-gray-700 mb-2 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                ${t('index.lectureSummary')}
              </h4>
              <div class="text-gray-600 text-sm bg-white p-4 rounded-lg border border-gray-200 max-h-48 overflow-y-auto summary-scroll">
                <ul class="list-disc list-inside space-y-2">${(data.summaries && data.summaries.length) ? data.summaries.map(s => '<li>' + escapeHtml(fixLatexEscapes((s.topic_name ? s.topic_name + ': ' : '') + (s.content || '').replace(/\n/g, ' '))) + '</li>').join('') : '<li>' + t('index.noSummary') + '</li>'}</ul>
              </div>
            </div>
            <div>
              <h4 class="font-semibold text-gray-700 mb-3 flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                ${t('index.studyFlashcards')}
              </h4>
              <div class="space-y-3">${renderFlashcardsHtml(data.flashcards) || '<p class="text-gray-500 text-sm">' + t('index.noFlashcards') + '</p>'}</div>
            </div>
            <div class="flex items-center gap-2">
              <a href="${API_BASE}/lectures/${lecture.id}/export" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">${t('index.exportPdf')}</a>
              <a href="${API_BASE}/lectures/${lecture.id}/export-docx" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">${t('index.exportWord')}</a>
              <a href="${API_BASE}/lectures/${lecture.id}/export-srt" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-700">${t('index.exportSrt')}</a>
              <a href="${API_BASE}/lectures/${lecture.id}/export-vtt" target="_blank" class="inline-flex items-center gap-2 px-4 py-2 bg-cyan-600 text-white rounded-lg text-sm font-medium hover:bg-cyan-700">${t('index.exportVtt')}</a>
            </div>
          </div>
          ` : ''}
        `;
        listEl.appendChild(card);
        if (window.renderMathInElement) {
          renderMathInElement(card, {
            delimiters: [
              {left: '$$',  right: '$$',  display: true},
              {left: '\\[', right: '\\]', display: true},
              {left: '$',   right: '$',   display: false},
              {left: '\\(', right: '\\)', display: false},
            ],
            throwOnError: false,
            strict: false,
            macros: {
              '\\R': '\\mathbb{R}',
              '\\N': '\\mathbb{N}',
              '\\Z': '\\mathbb{Z}',
              '\\Q': '\\mathbb{Q}',
              '\\C': '\\mathbb{C}',
              '\\F': '\\mathbb{F}',
              '\\eps': '\\varepsilon',
              '\\d':  '\\mathrm{d}',
            },
          });
        }
      });

      listEl.querySelectorAll('.lecture-toggle').forEach((el) => {
        el.addEventListener('click', () => {
          const card = el.closest('.lecture-card');
          const id = card.dataset.lectureId;
          const details = card.querySelector('.lecture-details');
          const arrow = card.querySelector('.expand-arrow');
          if (!details) return;
          const isHidden = details.classList.contains('hidden');
          listEl.setAttribute('data-expanded', isHidden ? id : '');
          details.classList.toggle('hidden', !isHidden);
          arrow.textContent = isHidden ? '▲' : '▼';
        });
      });

      listEl.querySelectorAll('.flashcard').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const inner = el.querySelector('.flashcard-inner');
          if (inner) {
            inner.classList.toggle('flipped');
          }
        });
      });

      listEl.querySelectorAll('.lecture-delete').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = btn.dataset.lectureId;
          if (!id || !confirm(t('index.deleteLectureConfirm'))) return;
          try {
            const res = await fetch(API_BASE + '/lectures/' + id, { method: 'DELETE' });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.detail || t('index.deleteFailed'));
            }
            await loadLectures();
          } catch (err) {
            alert(err.message || t('index.deleteError'));
          }
        });
      });

      restoreScrollState(listEl, scrollState);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    /**
     * Restore LaTeX commands that were corrupted by JSON escape-sequence parsing.
     * The AI sometimes outputs \boldsymbol, \frac, \rightarrow etc. without
     * doubling the backslash in JSON.  JSON parses \b → U+0008 (backspace),
     * \f → U+000C (form feed), \r → U+000D (CR), \t → U+0009 (tab),
     * \n → U+000A (LF) when followed by letters.  This restores them.
     * Applied to all text content before HTML insertion / KaTeX rendering.
     */
    function fixLatexEscapes(s) {
      return stripLayoutCommands((s || '')
        .replace(/\x08([a-zA-Z])/g, '\\b$1')   // backspace + letter → \b...
        .replace(/\x0c([a-zA-Z])/g, '\\f$1')   // form feed + letter  → \f...
        .replace(/\x0d([a-zA-Z])/g, '\\r$1')   // CR + letter         → \r...
        .replace(/\x09([a-zA-Z])/g, '\\t$1')   // tab + letter        → \t...
        .replace(/\x0a([a-zA-Z])/g, '\\n$1')); // LF + letter         → \n...
    }

    // Math segments are kept verbatim — \\ separates matrix rows in there.
    const MATH_SEGMENT = /(\$\$[\s\S]*?\$\$|\$[^$]*\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\))/;
    const MATH_SEGMENT_ONLY = /^(?:\$\$[\s\S]*?\$\$|\$[^$]*\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\))$/;
    const LAYOUT_COMMANDS = /\\(?:newline|linebreak|par|noindent|bigskip|medskip|smallskip)\b|\\\\(?!\\)/g;

    /**
     * Drop LaTeX line-break commands the model leaves in prose, between two
     * formulas. They sit outside $...$, so KaTeX never touches them and they
     * would otherwise print as a literal "\newline". Mirrors
     * strip_layout_commands() in app/services/math_utils.py.
     */
    function stripLayoutCommands(s) {
      if (!s || s.indexOf('\\') === -1) return s || '';
      return s.split(MATH_SEGMENT).map(function (part) {
        if (!part) return '';
        return MATH_SEGMENT_ONLY.test(part) ? part : part.replace(LAYOUT_COMMANDS, ' ');
      }).join('').replace(/[ \t]{2,}/g, ' ');
    }

    function lecturesSignature(lectures) {
      return JSON.stringify((lectures || []).map((l) => ({ id: l.id, status: l.status })));
    }

    let lastLecturesSignature = '';
    let lecturesLoaded = false;

    async function loadLectures() {
      try {
        const res = await fetch(API_BASE + '/lectures');
        const lectures = await res.json();
        const sig = lecturesSignature(lectures);
        lecturesLoaded = true;
        if (sig === lastLecturesSignature) return;
        lastLecturesSignature = sig;
        renderLectures(lectures);
      } catch (e) {
        console.error('Failed to load lectures', e);
        if (!lecturesLoaded) {
          document.getElementById('lectures-list').innerHTML = '<p class="text-red-500 p-4">' + t('index.loadLecturesError') + '</p>';
        }
      }
    }

    function checkUploadReady() {
      const title = document.getElementById('lecture-title').value.trim();
      const file = document.getElementById('file-upload').files[0];
      document.getElementById('upload-btn').disabled = !title || !file;
    }

    document.getElementById('file-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      document.getElementById('file-label').textContent = file ? file.name : t('index.fileSelect');
      checkUploadReady();
    });

    document.getElementById('lecture-title').addEventListener('input', checkUploadReady);

    document.getElementById('upload-btn').addEventListener('click', async () => {
      const titleInput = document.getElementById('lecture-title');
      const fileInput = document.getElementById('file-upload');
      const title = titleInput.value.trim();
      const file = fileInput.files[0];
      if (!title || !file) return;

      const btn = document.getElementById('upload-btn');
      btn.disabled = true;
      setUploadButtonLabel(true);

      try {
        let processQuery = 'title=' + encodeURIComponent(title);

        // Try direct R2 upload (presigned URL, no function size limit)
        const tokenRes = await fetch(API_BASE + '/upload-token?filename=' + encodeURIComponent(file.name));
        if (tokenRes.ok) {
          const { uploadUrl, publicUrl } = await tokenRes.json();

          // Use XHR for upload progress + reliable large-file handling
          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', uploadUrl);
            xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
            xhr.upload.addEventListener('progress', (e) => {
              if (e.lengthComputable) {
                const pct = Math.round((e.loaded / e.total) * 100);
                setUploadButtonLabel(true, pct < 100 ? `${pct}%` : null);
              }
            });
            xhr.addEventListener('load', () => {
              if (xhr.status >= 200 && xhr.status < 300) resolve();
              else reject(new Error(t('index.uploadFailed') + ': ' + xhr.responseText.slice(0, 120)));
            });
            xhr.addEventListener('error', () => reject(new Error(t('index.uploadFailed') + ' (network error)')));
            xhr.addEventListener('abort', () => reject(new Error(t('index.uploadFailed') + ' (aborted)')));
            xhr.send(file);
          });

          processQuery += '&blob_url=' + encodeURIComponent(publicUrl);
        } else {
          // Fallback: upload through the server (local dev, no R2 token)
          const formData = new FormData();
          formData.append('file', file);
          const uploadRes = await fetch(API_BASE + '/upload', { method: 'POST', body: formData });
          if (!uploadRes.ok) {
            const err = await uploadRes.json().catch(() => ({}));
            throw new Error(err.detail || t('index.uploadFailed'));
          }
          const { filename } = await uploadRes.json();
          processQuery += '&filename=' + encodeURIComponent(filename);
        }

        const processRes = await fetch(API_BASE + '/process?' + processQuery, { method: 'POST' });
        if (!processRes.ok) {
          const err = await processRes.json().catch(() => ({}));
          throw new Error(err.detail || t('index.startProcessingFailed'));
        }

        titleInput.value = '';
        fileInput.value = '';
        document.getElementById('file-label').textContent = t('index.fileSelect');
        await loadLectures();
      } catch (e) {
        alert(e.message || t('index.genericError'));
      } finally {
        btn.disabled = false;
        setUploadButtonLabel(false);
      }
    });

    async function checkAuth() {
      try {
        const res = await fetch(API_BASE + '/auth/me');
        if (!res.ok) throw new Error('not signed in');
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    document.getElementById('signout-btn').addEventListener('click', async () => {
      await fetch(API_BASE + '/auth/logout', { method: 'POST' });
      window.location.reload();
    });

    (async function initPage() {
      const i18n = await window.AppI18n.init();
      t = i18n.t;
      i18n.applyTranslations();
      document.title = t('index.pageTitle');
      setUploadButtonLabel(false);

      const user = await checkAuth();
      if (!user) {
        document.getElementById('signin-btn').classList.remove('hidden');
        document.getElementById('signin-btn').classList.add('flex');
        document.getElementById('signed-out').classList.remove('hidden');
        return;
      }
      document.getElementById('user-badge').classList.remove('hidden');
      document.getElementById('user-badge').classList.add('flex');
      document.getElementById('app-content').classList.remove('hidden');
      if (user.picture) document.getElementById('user-avatar').src = user.picture;
      document.getElementById('user-name').textContent = user.name || user.email || '';

      await loadLectures();
      setInterval(loadLectures, 5000);
    })();
  </script>
