<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Lecture with Captions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    (function () {
      const locale = (navigator.language || navigator.userLanguage || "he").toLowerCase().startsWith("he") ? "he" : "en";
      document.documentElement.lang = locale;
      document.documentElement.dir = locale === "he" ? "rtl" : "ltr";
    })();
  </script>
  <script src="/assets/i18n.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Heebo', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 p-4">
  <div class="max-w-4xl mx-auto">
    <a href="/" class="inline-block text-indigo-600 hover:text-indigo-800 mb-4" data-i18n="watch.backToLectures">Back to lectures</a>
    <div id="loading" class="text-center py-12 text-gray-500" data-i18n="watch.loading">Loading...</div>
    <div id="content" class="hidden">
      <h1 id="lecture-title" dir="auto" class="text-2xl font-bold text-gray-800 mb-4"></h1>
      <div class="bg-black rounded-xl overflow-hidden shadow-lg mb-4 relative">
        <video id="media" class="w-full" controls crossorigin="anonymous" playsinline>
          <!-- source set by JS for correct MIME -->
        </video>
        <button
          id="captions-toggle"
          type="button"
          class="absolute top-4 right-4 z-10 rounded-lg bg-black/70 px-4 py-2 text-sm font-medium text-white transition hover:bg-black/85"
          aria-pressed="true"
        >
          Hide Captions
        </button>
        <div id="subtitle-overlay" class="absolute bottom-0 left-0 right-0 py-3 px-4 text-center pointer-events-none" style="background: linear-gradient(transparent, rgba(0,0,0,0.85)); min-height: 4rem;">
          <p id="subtitle-text" class="text-white text-lg font-medium drop-shadow-lg"></p>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow p-6">
        <h2 class="font-semibold text-gray-700 mb-2" data-i18n="watch.transcript">Transcript</h2>
        <div id="transcript" dir="auto" class="text-gray-600 text-sm whitespace-pre-wrap max-h-96 overflow-y-auto"></div>
      </div>
    </div>
    <div id="error" class="hidden text-center py-12 text-red-600"></div>
  </div>
  <script>
    const pathMatch = window.location.pathname.match(/\/watch\/(\d+)/);
    const lectureId = pathMatch ? pathMatch[1] : null;
    const API_BASE = '';
    let t = function (key) { return key; };

    const MIME_BY_EXT = {
      mp4: 'video/mp4',
      webm: 'video/webm',
      ogv: 'video/ogg',
      m4a: 'audio/mp4',
      mp3: 'audio/mpeg',
      wav: 'audio/wav',
      ogg: 'audio/ogg'
    };

    const MAX_WORDS_PER_SEGMENT = 15;
    const SENTENCE_END = /[.?!。．？！]\s*$/;
    let captionsVisible = true;

    function buildSegments(words) {
      if (!words || !words.length) return [];
      const segments = [];
      let chunk = [];
      for (let i = 0; i < words.length; i++) {
        const w = words[i];
        const text = (w.text || '').trim();
        chunk.push({ start: w.start, end: w.end, text: text });
        const endOfSentence = text && SENTENCE_END.test(text);
        const atMaxWords = chunk.length >= MAX_WORDS_PER_SEGMENT;
        if (atMaxWords || endOfSentence) {
          const seg = {
            start: chunk[0].start,
            end: chunk[chunk.length - 1].end,
            text: chunk.map((c) => c.text).filter(Boolean).join(' ').trim()
          };
          if (seg.text) segments.push(seg);
          chunk = [];
        }
      }
      if (chunk.length > 0) {
        const seg = {
          start: chunk[0].start,
          end: chunk[chunk.length - 1].end,
          text: chunk.map((c) => c.text).filter(Boolean).join(' ').trim()
        };
        if (seg.text) segments.push(seg);
      }
      return segments;
    }

    function showSubtitleAt(segments, timeMs) {
      const el = document.getElementById('subtitle-text');
      if (!el) return;
      const seg = segments.find(s => timeMs >= s.start && timeMs <= s.end);
      el.textContent = seg ? seg.text.trim() : '';
    }

    function msToVttTimestamp(ms) {
      const total = Math.max(0, Math.floor(ms));
      const hours = Math.floor(total / 3600000);
      const minutes = Math.floor((total % 3600000) / 60000);
      const seconds = Math.floor((total % 60000) / 1000);
      const millis = total % 1000;
      return String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0') + '.' +
        String(millis).padStart(3, '0');
    }

    function attachNativeSubtitleTrack(media, segments) {
      if (!media || !segments || !segments.length) return;
      const existingTrack = media.querySelector('track[data-generated="true"]');
      if (existingTrack) {
        if (existingTrack.dataset.blobUrl) {
          URL.revokeObjectURL(existingTrack.dataset.blobUrl);
        }
        existingTrack.remove();
      }

      const cues = segments.map((seg, idx) => {
        const safeText = (seg.text || '').replace(/\r?\n/g, ' ').trim();
        return String(idx + 1) + '\n' +
          msToVttTimestamp(seg.start) + ' --> ' + msToVttTimestamp(seg.end) + '\n' +
          safeText + '\n';
      }).join('\n');
      const vtt = 'WEBVTT\n\n' + cues;
      const blob = new Blob([vtt], { type: 'text/vtt' });
      const blobUrl = URL.createObjectURL(blob);

      const track = document.createElement('track');
      track.kind = 'captions';
      track.srclang = 'he';
      track.label = t('watch.captionsTrackLabel');
      track.default = false;
      track.src = blobUrl;
      track.dataset.generated = 'true';
      track.dataset.blobUrl = blobUrl;
      media.appendChild(track);
    }

    function setNativeTrackMode(media, enabled) {
      if (!media || !media.textTracks) return;
      for (let i = 0; i < media.textTracks.length; i++) {
        media.textTracks[i].mode = enabled ? 'showing' : 'disabled';
      }
    }

    function updateCaptionsToggleButton() {
      const btn = document.getElementById('captions-toggle');
      if (!btn) return;
      btn.textContent = captionsVisible ? t('watch.hideCaptions') : t('watch.showCaptions');
      btn.setAttribute('aria-pressed', captionsVisible ? 'true' : 'false');
      btn.classList.toggle('bg-indigo-600/90', captionsVisible);
      btn.classList.toggle('hover:bg-indigo-700/90', captionsVisible);
      btn.classList.toggle('bg-black/70', !captionsVisible);
      btn.classList.toggle('hover:bg-black/85', !captionsVisible);
    }

    function syncSubtitleDisplayMode(media) {
      const overlay = document.getElementById('subtitle-overlay');
      const fullscreenEl = document.fullscreenElement || document.webkitFullscreenElement;
      const isFullscreen = fullscreenEl === media;
      if (overlay) {
        overlay.style.display = captionsVisible && !isFullscreen ? '' : 'none';
      }
      // Caption timing stays active even while hidden; this only switches the visible output mode.
      setNativeTrackMode(media, captionsVisible && isFullscreen);
      updateCaptionsToggleButton();
    }

    function syncCaptionsToCurrentTime(media, segments) {
      showSubtitleAt(segments, media.currentTime * 1000);
    }

    function startPage() {
      if (!lectureId) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
        document.getElementById('error').textContent = t('watch.invalidLectureId');
        return;
      }

      fetch(API_BASE + '/lectures/' + lectureId)
        .then((r) => {
          if (!r.ok) throw new Error(t('watch.lectureNotFound'));
          return r.json();
        })
        .then((lecture) => {
          document.getElementById('loading').classList.add('hidden');
          if (lecture.status !== 'completed') {
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error').textContent = t('watch.lectureStillProcessing');
            return;
          }
          document.getElementById('content').classList.remove('hidden');
          document.getElementById('lecture-title').textContent = lecture.title;
          document.getElementById('transcript').textContent = lecture.transcript || t('watch.noTranscript');

          const media = document.getElementById('media');
          const ext = (lecture.filename || '').split('.').pop() || 'mp4';
          const mime = MIME_BY_EXT[ext.toLowerCase()] || 'video/mp4';
          const url = API_BASE + '/static/' + encodeURIComponent(lecture.filename);
          media.innerHTML = '<source src="' + url + '" type="' + mime + '">';
          media.load();

          let segments = [];
          try {
            const words = typeof lecture.words_json === 'string' ? JSON.parse(lecture.words_json || '[]') : (lecture.words_json || []);
            segments = buildSegments(words);
          } catch (_) {}
          attachNativeSubtitleTrack(media, segments);
          syncSubtitleDisplayMode(media);

          const captionsToggle = document.getElementById('captions-toggle');
          if (captionsToggle) {
            captionsToggle.addEventListener('click', function () {
              captionsVisible = !captionsVisible;
              syncCaptionsToCurrentTime(media, segments);
              syncSubtitleDisplayMode(media);
            });
          }

          document.addEventListener('fullscreenchange', function () {
            syncSubtitleDisplayMode(media);
          });
          document.addEventListener('webkitfullscreenchange', function () {
            syncSubtitleDisplayMode(media);
          });
          media.addEventListener('loadedmetadata', function () {
            syncCaptionsToCurrentTime(media, segments);
            syncSubtitleDisplayMode(media);
          });

          media.addEventListener('timeupdate', function () {
            syncCaptionsToCurrentTime(media, segments);
          });
          media.addEventListener('seeked', function () {
            syncCaptionsToCurrentTime(media, segments);
          });
          media.addEventListener('error', function () {
            document.getElementById('subtitle-text').textContent = t('watch.mediaLoadError');
          });
        })
        .catch((e) => {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('error').classList.remove('hidden');
          document.getElementById('error').textContent = e.message || t('watch.loadError');
        });
    }

    (async function initPage() {
      const i18n = await window.AppI18n.init();
      t = i18n.t;
      i18n.applyTranslations();
      document.title = t('watch.pageTitle');
      updateCaptionsToggleButton();
      startPage();
    })();
  </script>
</body>
</html>
