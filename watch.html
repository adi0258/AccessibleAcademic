<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>צפייה בהרצאה עם כתוביות</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Heebo', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gray-100 p-4">
  <div class="max-w-4xl mx-auto">
    <a href="/" class="inline-block text-indigo-600 hover:text-indigo-800 mb-4">← חזרה להרצאות</a>
    <div id="loading" class="text-center py-12 text-gray-500">טוען...</div>
    <div id="content" class="hidden">
      <h1 id="lecture-title" class="text-2xl font-bold text-gray-800 mb-4"></h1>
      <div class="bg-black rounded-xl overflow-hidden shadow-lg mb-4">
        <video id="video" class="w-full" controls crossorigin="anonymous">
          <source id="video-src" src="" type="video/mp4" />
          <track id="track" kind="captions" srclang="he" label="עברית" />
        </video>
      </div>
      <div class="bg-white rounded-xl shadow p-6">
        <h2 class="font-semibold text-gray-700 mb-2">תמלול</h2>
        <div id="transcript" class="text-gray-600 text-sm whitespace-pre-wrap max-h-96 overflow-y-auto"></div>
      </div>
    </div>
    <div id="error" class="hidden text-center py-12 text-red-600"></div>
  </div>
  <script>
    const pathMatch = window.location.pathname.match(/\/watch\/(\d+)/);
    const lectureId = pathMatch ? pathMatch[1] : null;
    const API_BASE = '';

    if (!lectureId) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
      document.getElementById('error').textContent = 'מזהה הרצאה לא תקין';
    } else {
      fetch(API_BASE + '/lectures/' + lectureId)
        .then((r) => {
          if (!r.ok) throw new Error('הרצאה לא נמצאה');
          return r.json();
        })
        .then((lecture) => {
          document.getElementById('loading').classList.add('hidden');
          if (lecture.status !== 'completed') {
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error').textContent = 'ההרצאה עדיין בעיבוד';
            return;
          }
          document.getElementById('content').classList.remove('hidden');
          document.getElementById('lecture-title').textContent = lecture.title;
          const ext = (lecture.filename || '').split('.').pop() || 'mp4';
          const mime = ext === 'mp4' ? 'video/mp4' : ext === 'webm' ? 'video/webm' : 'video/mp4';
          document.getElementById('video-src').src = API_BASE + '/static/' + encodeURIComponent(lecture.filename);
          document.getElementById('video-src').type = mime;
          document.getElementById('transcript').textContent = lecture.transcript || 'אין תמלול';
        })
        .catch((e) => {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('error').classList.remove('hidden');
          document.getElementById('error').textContent = e.message || 'שגיאה בטעינה';
        });
    }
  </script>
</body>
</html>
